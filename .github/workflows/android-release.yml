name: Ytube Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ytube-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASS KEY_PASS KEY_ALIAS_VALUE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for ${name}. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD and ANDROID_KEY_ALIAS in Ytube repository settings."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/release-keystore.jks"
          test -s "$GITHUB_WORKSPACE/release-keystore.jks"
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-keystore.jks" >> "$GITHUB_ENV"

      - name: Prepare app configuration
        env:
          YOUTUBE_API_VALUE: ${{ secrets.YOUTUBE_API }}
        run: |
          if [ -n "$YOUTUBE_API_VALUE" ]; then
            printf 'YOUTUBE_API=%s\n' "$YOUTUBE_API_VALUE" > .env
          fi

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          mkdir -p release-output
          cp "$APK_PATH" release-output/Ytube-release.apk
          sha256sum release-output/Ytube-release.apk > release-output/SHA256SUMS.txt
          echo "apk_path=release-output/Ytube-release.apk" >> "$GITHUB_OUTPUT"
          ls -lh release-output/

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ytube-Android-Release
          path: |
            release-output/Ytube-release.apk
            release-output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Ytube Android Release #${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-output/Ytube-release.apk
            release-output/SHA256SUMS.txt
